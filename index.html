<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puncraft.ca</title>
  <meta name="description" content="Currently: building something.">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #7d8590;
      --accent: #58a6ff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px 20px;
    }

    .hero {
      text-align: center;
      margin-bottom: 32px;
    }

    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
      font-size: 1.5rem;
    }

    h1 {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .tagline {
      font-size: 0.9rem;
      color: var(--muted);
      font-style: italic;
    }

    .section {
      width: 100%;
      max-width: 640px;
    }

    .section-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin-bottom: 12px;
      text-align: center;
    }

    .project-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .project {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.2s, transform 0.15s;
    }

    .project:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    /* Odd one out gets the full row */
    .project:last-child:nth-child(odd) { grid-column: 1 / -1; }

    .project-icon {
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .project-info { flex: 1; }

    .project-name {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 2px;
    }

    .project-desc {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .project-arrow {
      color: var(--muted);
      font-size: 1rem;
    }

    @media (max-width: 480px) {
      .project-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!--
    Don't edit this file to change the page content.
    All text and links live in config.js.
  -->

  <div class="hero">
    <div class="avatar" id="avatar"></div>
    <h1 id="title"></h1>
    <p class="tagline" id="tagline"></p>
  </div>

  <div class="section">
    <div class="section-label" id="section-label"></div>
    <div class="project-list" id="project-list"></div>
  </div>

  <script src="config.js"></script>
  <script>
    (function () {
      var site = window.SITE;
      if (!site) {
        document.body.innerHTML =
          '<p style="color:#f85149;text-align:center">' +
          'config.js failed to load. Check it for a missing comma or quote.</p>';
        return;
      }

      function setText(id, value) {
        document.getElementById(id).textContent = value || '';
      }

      document.title = site.title || '';
      var meta = document.querySelector('meta[name="description"]');
      if (meta) meta.setAttribute('content', site.tagline || '');

      setText('title', site.title);
      setText('tagline', site.tagline);
      setText('avatar', site.avatar);
      setText('section-label', site.sectionLabel);

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }

      var list = document.getElementById('project-list');
      (site.links || []).forEach(function (link) {
        var a = el('a', 'project');
        a.href = link.url || '#';
        if (link.newTab) {
          a.target = '_blank';
          a.rel = 'noopener';
        }
        var info = el('div', 'project-info');
        info.appendChild(el('div', 'project-name', link.name));
        info.appendChild(el('div', 'project-desc', link.description));
        a.appendChild(el('div', 'project-icon', link.icon));
        a.appendChild(info);
        a.appendChild(el('div', 'project-arrow', '→'));
        list.appendChild(a);
      });
    })();
  </script>

</body>
</html>
